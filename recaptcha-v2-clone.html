<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>reCAPTCHA v2 Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./recaptcha-v2-clone.css" />
</head>
<body>
  <main class="page-shell">
    <section class="widget-demo" aria-label="Google reCAPTCHA clone">
      <div class="widget-header">
        <h1>reCAPTCHA v2 Checkbox Clone</h1>
        <div class="theme-switcher">
          <span>Theme</span>
          <button id="themeToggle" type="button" aria-pressed="false">Dark</button>
        </div>
      </div>

      <article class="recaptcha-card" id="recaptchaCard" data-theme="light">
        <button class="checkbox-btn" id="checkboxButton" type="button" aria-pressed="false">
          <span class="checkbox-shell" aria-hidden="true">
            <span class="spinner"></span>
            <svg class="checkmark" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5l5 5 9-11" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="label-text">I'm not a robot</span>
        </button>

        <div class="brand-panel">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
              <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#3c8ce7" />
                  <stop offset="100%" stop-color="#00d4ff" />
                </linearGradient>
              </defs>
              <circle cx="32" cy="32" r="28" fill="none" stroke="url(#grad)" stroke-width="6" />
              <path d="M34 14 L44 14 L44 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M30 50 L20 50 L20 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M18 22 A14 14 0 0 1 46 18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
              <path d="M46 42 A14 14 0 0 1 18 46" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
            </svg>
          </div>

          <div class="brand-copy">
            <span class="brand-name">reCAPTCHA</span>
            <div class="brand-links">
              <a href="#">Privacy</a>
              <span aria-hidden="true">·</span>
              <a href="#">Terms</a>
            </div>
          </div>
        </div>
      </article>

      <p class="note">Click the checkbox to see the loading and checked animation.</p>
    </section>
  </main>

  <script>
    const recaptchaCard = document.getElementById('recaptchaCard');
    const checkboxButton = document.getElementById('checkboxButton');
    const themeToggle = document.getElementById('themeToggle');

    checkboxButton.addEventListener('click', () => {
      if (checkboxButton.classList.contains('loading') || checkboxButton.classList.contains('checked')) {
        return;
      }

      checkboxButton.classList.add('loading');
      checkboxButton.setAttribute('aria-pressed', 'true');

      window.setTimeout(() => {
        checkboxButton.classList.remove('loading');
        checkboxButton.classList.add('checked');
      }, 1400);
    });

    themeToggle.addEventListener('click', () => {
      const isDark = recaptchaCard.dataset.theme === 'dark';
      recaptchaCard.dataset.theme = isDark ? 'light' : 'dark';
      themeToggle.textContent = isDark ? 'Dark' : 'Light';
      themeToggle.setAttribute('aria-pressed', String(!isDark));
    });
  </script>
</body>
</html>
